services:
  zyra-bot:
    image: zyra-bot
    build: .
    container_name: zyra-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - NODE_OPTIONS=--max-old-space-size=600
    deploy:
      resources:
        limits:
          memory: 900M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
