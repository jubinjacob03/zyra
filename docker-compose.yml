services:
  lavalink:
    image: fredboat/lavalink:master
    container_name: lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
      - "2333:2333/udp"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    env_file:
      - .env
    environment:
      - _JAVA_OPTIONS=-Xmx256m -Xms128m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - zyra-network

  zyra-bot:
    image: zyra-bot
    build: .
    container_name: zyra-bot
    restart: unless-stopped
    depends_on:
      - lavalink
    networks:
      - zyra-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - NODE_OPTIONS=--max-old-space-size=256
    command: sh -c "echo 'Sleeping 2 minutes to allow Lavalink to fully start...' && sleep 120 && node src/index.js"
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node src/index.js' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zyra-network:
    driver: bridge
