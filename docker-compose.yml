version: '3.8'

services:
  remani-bot:
    build: .
    container_name: remani-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      # Optional: Mount cookies for yt-dlp
      # - ./cookies.txt:/app/cookies.txt:ro
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - NODE_OPTIONS=--max-old-space-size=600
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 900M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Network mode (optional, for better connectivity)
    network_mode: bridge
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
